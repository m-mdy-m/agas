version: '3.8'

services:
  agas:
    build:
      context: .
      dockerfile: Dockerfile
    image: bitsgenix/agas:latest
    container_name: agas
    volumes:
      - ~/.agas:/home/agas/.agas:rw
    environment:
      - AGAS_BASE_URL=${AGAS_BASE_URL:-}
      - AGAS_AUTH_TOKEN=${AGAS_AUTH_TOKEN:-}
      - AGAS_TIMEOUT=${AGAS_TIMEOUT:-30000}
    networks:
      - agas-network
    stdin_open: true
    tty: true

networks:
  agas-network:
    driver: bridge
